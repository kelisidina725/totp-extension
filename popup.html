<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证码</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4 5v6c0 5 3.4 9.2 8 11 4.6-1.8 8-6 8-11V5l-8-3Z"></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
        </span>
        <h1>验证码</h1>
        <span class="badge" id="countBadge">0</span>
      </div>
      <button id="settingsBtn" class="add-btn" title="添加与管理账号" aria-label="添加账号">＋</button>
    </header>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索账号" autocomplete="off" spellcheck="false">
    </div>

    <main id="list" class="list" aria-live="polite"></main>

    <footer class="footer">
      <button id="manageBtn" class="manage-btn">管理全部账号 <span aria-hidden="true">›</span></button>
    </footer>
  </div>
  <div class="toast" id="toast"></div>
  <script src="totp.js"></script>
  <script src="otpauth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
